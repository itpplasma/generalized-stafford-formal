version: "v0.4"

project:
  name: "Generalized Stafford: Theorem A"
  description: >-
    Lean formalization of affine generation over simple right Noetherian rings
    with infinite centre. For a right ideal I containing a regular element with
    Kdim(R/I) finite, every x and nonzero t admit H with I + (x + H t)R = R
    (Theorem A'). For a regular d with Kdim(R/dR) finite, every nonzero a and
    every B admit H, U, V with 1 = d*U + (B + H*a)*d*V (Theorem A). Corollaries:
    the dimension hypothesis holds when Kdim R <= omega (B); prescribed cyclic
    generators of finite Goldie-torsion modules (C.1); two-generated right
    ideals (C.2); and ceil(rho M) <= mu(M) <= floor(rho M) + 1 for the
    normalized Goldie rank rho (C.3).
  # Authors and maintainers use the structured {name, orcid} form of
  # itpplasma/global-stafford-formal, even if the current upstream schema
  # prefers plain strings.
  authors:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  responsible_maintainers:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  url: "https://github.com/itpplasma/generalized-stafford-formal"
  registration_status: "not-registered"
  note: >-
    Private repository. Registration, release, DOI and visibility change each
    require explicit human authorization (docs/release-runbook.md).

