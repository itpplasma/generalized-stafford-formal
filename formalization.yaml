    author_endorsement: "participated"
  - title: "Module structure of Weyl algebras"
    authors:
      - "J. T. Stafford"
    type: "paper"
    id: "https://doi.org/10.1112/jlms/s2-18.3.429"
    location: >-
      Journal of the London Mathematical Society (2) 18 (1978), 429-442,
      Conjecture 3.8
    relationship: "background"
    note: >-
      Conjecture 3.8 states the identity R = dR + HdR for Weyl algebras, the
      case a = 1, B = 0 of Theorem A.
  - title: "Module structure of Weyl algebras"
    authors:
      - "Gwyn Bellamy"
    type: "paper"
    id: "https://doi.org/10.1112/jlms.70373"
    location: >-
      Journal of the London Mathematical Society (2) 113 (2026), e70373
    relationship: "background"
    note: >-
      Survey of Stafford's results and open questions on module structure.
  - title: "The structure of prime rings under ascending chain conditions"
    authors:
      - "A. W. Goldie"
    type: "paper"
    location: >-
      Proceedings of the London Mathematical Society (3) 8 (1958), 589-608
    relationship: "background"
    note: >-
      Goldie's theorem; formalized for simple right Noetherian rings in
      AlgebraicAnalysis.RingTheory.Goldie.
  - title: "Noncommutative Noetherian Rings"
    authors:
      - "J. C. McConnell"
      - "J. C. Robson"
    type: "book"
    location: >-
      Graduate Studies in Mathematics 30, American Mathematical Society (2001),
      Chapters 2 and 6
    relationship: "background"
    note: >-
      Standard reference for Ore localization, Goldie theory, uniform dimension
      and Krull (deviation) dimension.

