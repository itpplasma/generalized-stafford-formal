fidelity:
  divergences: >-
    Right modules are modules over the opposite ring. Kdim is defined inline as
    a deviation bound on submodule lattices. The condition aQ = IQ of C.2 is
    stated elementwise (every y in I has a regular s with y s in aR). C.3 is
    stated through uniform dimensions without division or rounding; its
    identification with rho uses s = udim(R_R) and
    length_Q(M (x) Q) = udim(M/t(M)). The C.2 full-rank existence statement
    assumes only (S), (N). The ordinal refinement delta(d) < Kdim R of the
    dimension part of Corollary B is omitted. The abstract theorems are stated
    for right ideals and right modules only; left-sided forms are stated for
    the applications (all filtered-ring and enveloping-algebra statements for R
    and its opposite ring; the Weyl-algebra and D_k(A) two-generation and
    cyclicity statements, and Theorem A for D_k(A)).

