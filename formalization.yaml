automation:
  methods:
    - method: "manual"
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Human mathematical direction, task selection, integration and release
        control.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation and cloud containers"
      prompting_notes: "n/a"
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        A controller agent assigns tasks and integrates; worker agents write
        Lean, documentation and independent statement audits.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation and cloud containers"
      prompting_notes: >-
        Tasks name the target statement, allowed files and the verification
        commands; audits receive a frozen candidate and named scopes.
  spend_usd: "not tracked"
  notes: >-
    Model use records process assistance and does not assign authorship of a
    mathematical idea.

fidelity:
  divergences: >-
    Right modules are modules over the opposite ring. Kdim is defined inline as
    a deviation bound on submodule lattices. The condition aQ = IQ of C.2 is
    stated elementwise (every y in I has a regular s with y s in aR). The C.2
    full-rank existence statement assumes only (S), (N). The dimension fact
    used by Corollary B (Kdim R <= omega implies Kdim(R/dR) finite, cited in
    the paper from McConnell-Robson 6.3.9) is proved in the library and stated
    in the challenge as knownDimension_hAll_of_omega. The abstract theorems are stated
    for right ideals and right modules only; left-sided forms are stated for
    the applications (all filtered-ring and enveloping-algebra statements for R
    and its opposite ring; the Weyl-algebra and D_k(A) two-generation and
    cyclicity statements, and Theorem A for D_k(A)).

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The written proof passed independent agent proof-audits. The earlier
    46-theorem challenge passed an independent statement-faithfulness audit
    (2 November 2026); the reduced 41-theorem challenge still needs one.
    Human expert review is open.

