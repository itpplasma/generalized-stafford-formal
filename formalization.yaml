    relationship: "background"
    note: >-
      Survey of Stafford's results and open questions on module structure.
  - title: "The structure of prime rings under ascending chain conditions"
    authors:
      - "A. W. Goldie"
    type: "paper"
    location: >-
      Proceedings of the London Mathematical Society (3) 8 (1958), 589-608
    relationship: "background"
    note: >-
      Goldie's theorem; formalized for simple right Noetherian rings in
      AlgebraicAnalysis.RingTheory.Goldie.
  - title: "Noncommutative Noetherian Rings"
    authors:
      - "J. C. McConnell"
      - "J. C. Robson"
    type: "book"
    location: >-
      Graduate Studies in Mathematics 30, American Mathematical Society (2001),
      Chapters 2 and 6
    relationship: "background"
    note: >-
      Standard reference for Ore localization, Goldie theory, uniform dimension
      and Krull (deviation) dimension.

